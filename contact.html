<header class="container text-center">
<h1>RESTORAL</h1>
<p>Contactez-nous</p>
</header>

<section class="container">
<h2>Nos coordonnées</h2>
<ul>
<li><b>Adresse :</b> av.université n°48</li>
<li><b>Téléphone :</b> 0800004500</li>
<li><b>Email :</b><a href="mailto:contact@restoral.cd">contact@restoral.cd</a></li>
</ul>
</section>

<section class="container">
<h2>Envoyez-nous un message</h2>
<form>
<fieldset>
   <legend>Formulaire de contact</legend>
<div class="mb-3">
<label for="nom" class="form-label">Votre nom:</label>
<input type="text" id="nom" class="form-control" placeholder="Ex : Jewel" />
</div>
<div class="mb-3">
<label for="email" class="form-label">Votre email:</label>
<input type="email" id="email" class="form-control" placeholder="email@gmail.com" />
</div>
<div class="mb-3">
<label for="message" class="form-label">Votre message:</label>
<textarea id="message" class="form-control" rows="4"></textarea>
</div>
<input type="button" class="btn btn-danger" value="Envoyer" />
</fieldset>
</form>
</section>

<footer class="bg-dark text-white text-center">
